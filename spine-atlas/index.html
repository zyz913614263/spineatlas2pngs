<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spine 图集拆图</title>
  <style>
    :root {
      --ink: #241c16;
      --muted: #6f6256;
      --line: #e3d8c8;
      --paper: #f6f1e8;
      --card: #fffdf8;
      --teal: #0f5f5a;
      --teal-deep: #0b4541;
      --warn: #8a4b12;
      --warn-bg: #fff1df;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 95, 90, 0.08), transparent 32rem),
        var(--paper);
      font: 15px/1.5 "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "Source Han Serif SC", serif;
    }

    button, input, select { font: inherit; }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    header p {
      max-width: 68ch;
      margin: 8px 0 0;
      color: var(--muted);
    }

    main {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 18px;
      margin-top: 22px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .drop {
      display: grid;
      gap: 4px;
      min-height: 92px;
      margin-bottom: 10px;
      padding: 12px;
      border: 1.5px dashed #cbbba6;
      border-radius: 12px;
      background: #fbf7f1;
      cursor: pointer;
    }

    .drop { position: relative; }
    .drop strong { font-size: 16px; }
    .drop span, .region-meta { color: var(--muted); }
    .drop.ready { border-style: solid; border-color: var(--teal); background: #f3faf8; }
    .drop input {
      position: absolute;
      inset: 0;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    label.option {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 8px 0;
    }

    select, button { border-radius: 10px; }

    select {
      width: 100%;
      margin: 4px 0 10px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      background: white;
    }

    .actions { display: grid; gap: 8px; margin-top: 12px; }

    button {
      border: 1px solid var(--teal);
      background: white;
      color: var(--teal-deep);
      padding: 9px 12px;
      cursor: pointer;
    }

    button.primary { background: var(--teal); color: white; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:not(:disabled):hover { background: #e7f4f2; }
    button.primary:not(:disabled):hover { background: var(--teal-deep); }

    .status {
      min-height: 1.5em;
      margin: 12px 0 0;
      color: var(--teal-deep);
    }

    .warnings {
      margin: 10px 0 0;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--warn-bg);
      color: var(--warn);
    }

    .warnings p { margin: 0 0 4px; }
    .warnings p:last-child { margin: 0; }

    .stage {
      display: grid;
      gap: 12px;
    }

    .preview-frame {
      overflow: auto;
      max-height: 68vh;
      border-radius: 12px;
      background:
        linear-gradient(45deg, #efe6da 25%, transparent 25%),
        linear-gradient(-45deg, #efe6da 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #efe6da 75%),
        linear-gradient(-45deg, transparent 75%, #efe6da 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
      background-color: #f8f4ee;
    }

    canvas { display: block; max-width: 100%; height: auto; cursor: crosshair; }

    .thumbs, .regions {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
      gap: 8px;
    }

    .regions {
      grid-template-columns: 1fr;
      max-height: 280px;
      overflow: auto;
    }

    .thumb, .region {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      text-align: left;
    }

    .thumb {
      padding: 6px;
      cursor: pointer;
    }

    .thumb img, .thumb canvas {
      width: 100%;
      height: 72px;
      object-fit: contain;
      background: #f3eee6;
      border-radius: 6px;
    }

    .thumb b, .region b { display: block; font-size: 13px; }
    .region {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      padding: 8px 10px;
      color: inherit;
    }

    .thumb.active, .region.active { border-color: var(--teal); box-shadow: inset 0 0 0 1px var(--teal); }

    .empty {
      margin: 0;
      color: var(--muted);
    }

    h2 {
      margin: 0 0 8px;
      font-size: 15px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      header h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Spine 图集拆图</h1>
      <p>选择图片所在文件夹，会自动带上同名 <code>.atlas</code>。按区域拆成独立图片，或导出成分层 PSD。处理在浏览器本地完成，图片不会上传。没有骨架文件时，图层按图集上的位置摆放，不会自动拼回角色姿势。</p>
    </header>
    <main>
      <section class="panel">
        <div class="drop" id="image-drop">
          <strong>图集图片</strong>
          <span id="image-name">选择图片所在文件夹，自动匹配同名 .atlas</span>
          <input id="image-input" type="file" webkitdirectory multiple>
        </div>
        <div class="drop" id="atlas-drop">
          <strong>Spine 图集描述</strong>
          <span id="atlas-name">选 .atlas 文本，不要选骨架 json</span>
          <input id="atlas-input" type="file">
        </div>
        <label id="pair-wrap" hidden>
          同名组合
          <select id="pair-select"></select>
        </label>
        <label id="page-wrap" hidden>
          图集页面
          <select id="page-select"></select>
        </label>
        <label class="option">
          <input id="restore-trim" type="checkbox">
          <span>还原打包时裁掉的透明边</span>
        </label>
        <label class="option">
          <input id="unpremultiply" type="checkbox">
          <span>取消预乘透明。图集标了 pma 时会自动勾上。</span>
        </label>
        <div class="actions">
          <button id="export-zip" class="primary" type="button" disabled>下载文件夹（ZIP）</button>
          <button id="export-psd" type="button" disabled>下载 PSD</button>
        </div>
        <div id="warnings"></div>
        <p class="status" id="status" aria-live="polite"></p>
      </section>
      <section class="stage">
        <div class="panel">
          <h2>图集预览</h2>
          <div class="preview-frame">
            <canvas id="preview" width="640" height="360"></canvas>
          </div>
          <p class="empty" id="preview-empty">还没有图片。</p>
        </div>
        <div class="panel">
          <h2>拆出的部件</h2>
          <div class="thumbs" id="thumbs"></div>
          <p class="empty" id="thumbs-empty">拆图结果会显示在这里。</p>
        </div>
        <div class="panel">
          <h2>区域</h2>
          <div class="regions" id="regions"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="ui.js"></script>
</body>
</html>
